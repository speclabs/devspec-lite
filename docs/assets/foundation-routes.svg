<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc">
  <title id="title">Foundation routes for new and existing repositories</title>
  <desc id="desc">New repositories begin with project context. Existing repositories begin with extraction, then share the same foundation flow.</desc>
  <style>.t{font:600 18px system-ui,sans-serif;fill:#102a43}.s{font:14px system-ui,sans-serif;fill:#243b53}.n{fill:#e8f1fb;stroke:#3478c8;stroke-width:2}.a{fill:none;stroke:#3478c8;stroke-width:2.5;marker-end:url(#m)}.r{fill:#eef8f1;stroke:#27864b;stroke-width:2}.h{font:700 22px system-ui,sans-serif;fill:#102a43}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3478c8"/></marker></defs>
  <text x="28" y="36" class="h">Choose the foundation route</text>
  <text x="28" y="62" class="s">Both routes produce the same Git-tracked foundation; existing repositories first capture evidence.</text>
  <rect x="28" y="95" width="155" height="54" rx="10" class="r"/><text x="105" y="128" text-anchor="middle" class="t">New repository</text>
  <rect x="28" y="205" width="155" height="54" rx="10" class="r"/><text x="105" y="238" text-anchor="middle" class="t">Existing repository</text>
  <rect x="240" y="205" width="130" height="54" rx="10" class="n"/><text x="305" y="238" text-anchor="middle" class="t">extract</text>
  <rect x="430" y="150" width="155" height="54" rx="10" class="n"/><text x="507" y="183" text-anchor="middle" class="t">projectcontext</text>
  <rect x="635" y="150" width="125" height="54" rx="10" class="n"/><text x="697" y="183" text-anchor="middle" class="t">techstack</text>
  <rect x="810" y="150" width="165" height="54" rx="10" class="n"/><text x="892" y="183" text-anchor="middle" class="t">codebase-structure</text>
  <rect x="1025" y="150" width="110" height="54" rx="10" class="n"/><text x="1080" y="176" text-anchor="middle" class="t">coding</text><text x="1080" y="194" text-anchor="middle" class="t">standards → rules</text>
  <path d="M183 122H405V164H430" class="a"/><path d="M183 232H240" class="a"/><path d="M370 232H405V191H430" class="a"/><path d="M585 177H635M760 177H810M975 177H1025" class="a"/>
</svg>
