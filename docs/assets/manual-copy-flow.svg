<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Manual copy flow for Devspec Lite</title>
  <desc id="desc">A developer checks out the latest main branch, chooses one agent profile, copies the canonical artifacts into a target repository, verifies the files, and commits them. Updates repeat the comparison and copy steps without requiring the CLI.</desc>
  <style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#263653}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.start{fill:#123745;stroke:#39c9d9}.safe{fill:#17372d;stroke:#64d49a}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;fill:#69d8ff}.title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#aab8cf}.node{font:700 15px system-ui,sans-serif;fill:#f8fafc}.meta{font:12px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#9c8cff;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowV)}.note{font:13px system-ui,sans-serif;fill:#c1cae0}.foot{font:600 11px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14213a"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8ff"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9c8cff"/></marker></defs>
  <rect class="bg" width="1440" height="440"/><rect fill="url(#grid)" width="1440" height="440" opacity=".9"/><rect class="surface" x="28" y="28" width="1384" height="384" rx="20"/>
  <text x="64" y="67" class="eyebrow">DEVSPEC LITE / MANUAL COPY</text><text x="64" y="103" class="title">Copy the latest main profile without an installer</text><text x="64" y="131" class="sub">Main-branch files are canonical. Python and the CLI are optional, not required.</text>
  <rect class="card start" x="84" y="220" width="200" height="62" rx="10"/><text x="104" y="246" class="node">Check out main</text><text x="104" y="266" class="meta">latest canonical files</text>
  <rect class="card" x="350" y="220" width="185" height="62" rx="10"/><text x="370" y="246" class="node">Choose profile</text><text x="370" y="266" class="meta">one agent host</text>
  <rect class="card" x="600" y="220" width="210" height="62" rx="10"/><text x="620" y="246" class="node">Copy required files</text><text x="620" y="266" class="meta">devspec + wrapper</text>
  <rect class="card" x="875" y="220" width="180" height="62" rx="10"/><text x="895" y="246" class="node">Verify paths</text><text x="895" y="266" class="meta">manifest + wrapper</text>
  <rect class="card safe" x="1120" y="220" width="210" height="62" rx="10"/><text x="1140" y="246" class="node">Commit target files</text><text x="1140" y="266" class="meta">start the workflow</text>
  <path class="flow" d="M284 251H350M535 251H600M810 251H875M1055 251H1120"/><path class="loop" d="M965 220V166H705V220"/><text x="714" y="153" class="note">latest main → compare, copy approved changes, commit</text><text x="64" y="366" class="foot">NO PYTHON • NO CLI • NO PACKAGE MANAGER • PRESERVE LOCAL CUSTOMIZATIONS</text>
</svg>