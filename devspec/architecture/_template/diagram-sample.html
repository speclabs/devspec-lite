<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample request routing diagram</title>
  <style>
    :root{color-scheme:dark;--bg:#070b18;--panel:#101827;--text:#f8fafc;--muted:#aab8cf;--line:#263653;--grid:#14213a;--accent:#69d8ff}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--bg);background-size:32px 32px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    main{min-height:100vh;display:grid;place-items:center;padding:28px}article{width:min(100%,1200px);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 44px #0008}
    header{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.14em}h1{margin:8px 0;font-size:clamp(28px,4vw,40px)}p,footer{margin:0;color:var(--muted);line-height:1.5}.diagram{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#070b18}.diagram svg{display:block;width:100%;height:auto}footer{margin-top:14px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <article>
      <header>
        <div class="eyebrow">DEVSPEC LITE / EXAMPLE</div>
        <h1>Customer request routing</h1>
        <p>Choose Quickfix for one local, low-risk change; otherwise create a work item.</p>
      </header>
      <section class="diagram" aria-label="Customer request routing diagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
          <title id="title">Sample request routing diagram</title>
          <desc id="desc">A request is classified as a localized quickfix or a work item.</desc>
          <style>.t{font:600 15px system-ui,sans-serif;fill:#f8fafc}.n{fill:#16223a;stroke:#69d8ff;stroke-width:2}.a{fill:none;stroke:#69d8ff;stroke-width:2;marker-end:url(#m)}</style>
          <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8ff"/></marker></defs>
          <rect x="24" y="64" width="140" height="48" rx="8" class="n"/><text x="94" y="94" text-anchor="middle" class="t">Request</text>
          <rect x="280" y="24" width="160" height="48" rx="8" class="n"/><text x="360" y="54" text-anchor="middle" class="t">quickfix</text>
          <rect x="280" y="112" width="160" height="48" rx="8" class="n"/><text x="360" y="142" text-anchor="middle" class="t">story</text>
          <path d="M164 78H240V48H280M164 98H240V136H280" class="a"/><text x="196" y="44" class="t">local</text><text x="196" y="132" class="t">broader</text>
        </svg>
      </section>
      <footer>Example rendering • replace all labels with repository evidence</footer>
    </article>
