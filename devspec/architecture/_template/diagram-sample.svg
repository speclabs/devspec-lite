<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">Customer request routing sample</title><desc id="desc">A confirmed request is routed to a localized quickfix or to a traceable work item based on scope and risk.</desc><style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#263653}.lane{fill:#0c1323;stroke:#263653;stroke-dasharray:6 7}.eyebrow{font:700 11px system-ui,sans-serif;letter-spacing:1.8px;fill:#69d8ff}.title{font:700 24px system-ui,sans-serif;fill:#f8fafc}.sub{font:13px system-ui,sans-serif;fill:#aab8cf}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.quick{fill:#3a2b10;stroke:#ffc857}.start{fill:#123745;stroke:#39c9d9}.decision{fill:#1d3450;stroke:#69d8ff;stroke-width:2}.node{font:700 14px system-ui,sans-serif;fill:#f8fafc}.meta{font:11px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.4;marker-end:url(#a)}.gold{fill:none;stroke:#ffc857;stroke-width:2.4;marker-end:url(#g)}.label{font:700 11px system-ui,sans-serif;fill:#ffd978}.foot{font:600 10px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#14213a"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#69d8ff"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#ffc857"/></marker></defs><rect class="bg" width="960" height="400"/><rect fill="url(#grid)" width="960" height="400"/><rect class="surface" x="22" y="22" width="916" height="356" rx="18"/><text x="52" y="57" class="eyebrow">DEVSPEC LITE / PROCESS FLOW SAMPLE</text><text x="52" y="88" class="title">Customer request routing</text><text x="52" y="111" class="sub">Use confirmed scope and risk to select one durable route.</text><rect class="lane" x="52" y="138" width="856" height="168" rx="12"/><rect class="card start" x="86" y="205" width="142" height="54" rx="9"/><text x="106" y="228" class="node">Request</text><text x="106" y="247" class="meta">confirmed need</text><polygon class="decision" points="338,190 396,232 338,274 280,232"/><text x="338" y="228" text-anchor="middle" class="node">Local +</text><text x="338" y="246" text-anchor="middle" class="node">low risk?</text><rect class="card quick" x="500" y="164" width="166" height="54" rx="9"/><text x="520" y="187" class="node">quickfix</text><text x="520" y="206" class="meta">focused validation</text><rect class="card" x="500" y="250" width="166" height="54" rx="9"/><text x="520" y="273" class="node">work item</text><text x="520" y="292" class="meta">story to review</text><rect class="card" x="740" y="205" width="130" height="54" rx="9"/><text x="760" y="228" class="node">Record</text><text x="760" y="247" class="meta">evidence + next</text><path class="flow" d="M228 232H280"/><path class="gold" d="M396 211H450V191H500M666 191H705V232H740"/><path class="flow" d="M396 253H450V277H500M666 277H705V232H740"/><text x="420" y="199" class="label">YES</text><text x="416" y="270" class="label">NO / RISK</text><text x="52" y="345" class="foot">EVIDENCE: QUICKFIX + STORY CONTRACTS • TYPE: PROCESS FLOW • STATUS: COMPLETE</text></svg>
