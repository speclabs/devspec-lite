<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Sample request routing diagram</title>
  <desc id="desc">A request is classified as a localized quickfix or a work item.</desc>
  <style>.t{font:600 15px system-ui,sans-serif;fill:#102a43}.n{fill:#e8f1fb;stroke:#3478c8;stroke-width:2}.a{fill:none;stroke:#3478c8;stroke-width:2;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3478c8"/></marker></defs>
  <rect x="24" y="64" width="140" height="48" rx="8" class="n"/><text x="94" y="94" text-anchor="middle" class="t">Request</text>
  <rect x="280" y="24" width="160" height="48" rx="8" class="n"/><text x="360" y="54" text-anchor="middle" class="t">quickfix</text>
  <rect x="280" y="112" width="160" height="48" rx="8" class="n"/><text x="360" y="142" text-anchor="middle" class="t">story</text>
  <path d="M164 78H240V48H280M164 98H240V136H280" class="a"/><text x="196" y="44" class="t">local</text><text x="196" y="132" class="t">broader</text>
</svg>
