name: Python Package CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Package test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Install package for tests
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke test wheel on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .smoke
          . .smoke/bin/activate
          python -m pip install dist/*.whl
          devspec --version
          devspec init --target "$(mktemp -d)" --profile all --repo-state existing
      - name: Smoke test wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .smoke
          $wheel = Get-ChildItem dist -Filter '*.whl' | Select-Object -First 1
          & .\.smoke\Scripts\python.exe -m pip install $wheel.FullName
          $target = Join-Path $env:RUNNER_TEMP 'devspec-wheel-smoke'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          .\.smoke\Scripts\devspec.exe --version
          .\.smoke\Scripts\devspec.exe init --target $target --profile all --repo-state existing