name: Python Package Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Install package for tests
        run: python -m pip install -e .
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_release_version.py --tag "${GITHUB_REF_NAME}"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Create package checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f ! -name devspec-lite-python-package-checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/devspec-lite-python-package-checksums.txt
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devspec-lite-python-package-dist
          path: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Attach release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*